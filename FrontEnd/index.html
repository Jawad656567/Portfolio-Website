<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/title.svg" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>Jawad Ali | MERN Stack Developer & Portfolio</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Official portfolio of Jawad Ali, a MERN Stack Developer. Explore my web development projects, skills, experience and full stack work using React, Node.js, Express.js and MongoDB."
    />

    <!-- Author -->
    <meta name="author" content="Jawad Ali" />

    <!-- Search Engine Crawling -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://jawaddev.site/" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Jawad Ali | MERN Stack Developer & Portfolio"
    />

    <meta
      property="og:description"
      content="Official portfolio of Jawad Ali. Explore my MERN Stack projects, skills and web development experience."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jawaddev.site/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="Jawad Ali | MERN Stack Developer & Portfolio"
    />

    <meta
      name="twitter:description"
      content="Official portfolio of Jawad Ali, MERN Stack Developer."
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jawad Ali",
        "url": "https://jawaddev.site/",
        "jobTitle": "MERN Stack Developer",
        "description": "Jawad Ali is a MERN Stack Developer building modern web applications using React, Node.js, Express.js and MongoDB.",
        "knowsAbout": [
          "MERN Stack",
          "React",
          "JavaScript",
          "Tailwind CSS",
          "Node.js",
          "Express.js",
          "MongoDB",
          "Web Development"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
